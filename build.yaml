# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property.
---
include:
  # Left Side with ZMK Studio Snippet enabled natively
  - board: nice_nano_v2
    shield: compression4c_left nice_view
    snippet: studio-rpc-usb-uart
  
  # Right Side (Studio snippet omitted as it only compiles on the central/left half)
  - board: nice_nano_v2
    shield: compression4c_right nice_view
